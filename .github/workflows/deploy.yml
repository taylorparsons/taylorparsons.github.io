---
name: Deploy static site to GitHub Pages

# Publishes the repository root as a static site using the official GitHub
# Pages Actions flow. Set Settings → Pages → Source to "GitHub Actions".

"on":
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege permissions required to deploy to Pages.
permissions:
  contents: read

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure Pages
        # actions/configure-pages v6.0.0
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Render project pages
        run: python3 scripts/build.py
      - name: Upload artifact
        # actions/upload-pages-artifact v5.0.0
        uses: >-
          actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          # Publish the whole repo root. This template's links are relative,
          # so no base path is needed.
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # actions/deploy-pages v5.0.0
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
